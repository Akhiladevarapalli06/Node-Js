<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Category Filter</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        h1 {
            color: #333;
        }

        #product-list {
            margin-top: 20px;
            width: 300px;
            background: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .product-item {
            padding: 10px;
            border-bottom: 1px solid #eee;
        }

        .product-item:last-child {
            border-bottom: none;
        }

        select {
            padding: 10px;
            margin-top: 10px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }
    </style>
</head>
<body>
    <h1>Filter Products by Category</h1>
    <select id="category-select">
        <option value="All">All</option>
        <option value="Electronics">Electronics</option>
        <option value="Clothing">Clothing</option>
        <option value="Home Appliances">Home Appliances</option>
    </select>

    <div id="product-list"></div>

    <script>
        // Sample product data
        const products = [
            { name: 'Laptop', category: 'Electronics' },
            { name: 'T-Shirt', category: 'Clothing' },
            { name: 'Smartphone', category: 'Electronics' },
            { name: 'Blender', category: 'Home Appliances' },
            { name: 'Jeans', category: 'Clothing' },
            { name: 'Headphones', category: 'Electronics' }
        ];

        const productList = document.getElementById('product-list');
        const categorySelect = document.getElementById('category-select');

        // Function to display products based on selected category
        function displayProducts(category) {
            productList.innerHTML = ''; // Clear the existing list
            const filteredProducts = category === 'All' 
                ? products 
                : products.filter(product => product.category === category);

            if (filteredProducts.length === 0) {
                productList.innerHTML = '<p>No products found.</p>';
                return;
            }

            filteredProducts.forEach(product => {
                const productItem = document.createElement('div');
                productItem.className = 'product-item';
                productItem.textContent = product.name;
                productList.appendChild(productItem);
            });
        }

        // Event listener for category change
        categorySelect.addEventListener('change', (e) => {
            displayProducts(e.target.value);
        });

        // Initial display of all products
        displayProducts('All');
    </script>
</body>
</html>
